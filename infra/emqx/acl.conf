# Example ACL policy. Apply through EMQX file ACL or transform to DB/API ACL.
# Device username format: device:NODE-001
# A device can publish telemetry, heartbeat, status, event, and response in its own topic space.
# A device can subscribe only to command and config in its own topic space.

{allow, {user, "api_service"}, subscribe, ["$share/api-consumers/iot/+/+/+/+/telemetry", "$share/api-consumers/iot/+/+/+/+/status"]}.
{allow, {user, "api_service"}, publish, ["iot/+/+/+/+/command", "iot/+/+/+/+/config"]}.

{allow, {user, "device:NODE-001"}, publish, ["iot/+/+/+/NODE-001/status", "iot/+/+/+/NODE-001/telemetry", "iot/+/+/+/NODE-001/event", "iot/+/+/+/NODE-001/response"]}.
{allow, {user, "device:NODE-001"}, subscribe, ["iot/+/+/+/NODE-001/command", "iot/+/+/+/NODE-001/config"]}.

{deny, all}.
